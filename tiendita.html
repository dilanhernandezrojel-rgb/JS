<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <title>PRACTICAS JAVASCRIPT</title>
</head>
<body>
    <nav class="navbar md:navbar-expand bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="img/aqua1.webp" alt="Bootstrap" width="30" height="24">
                Tiendita
            </a>
        </div>
    </nav>

    <div class="container p-4 mt-5 card bg-inverse">
        <h1 class="text-center fg-black">Tiendita</h1><br>
        <div class="d-flex justify-content-end">
            <button type="button" class="btn-solid btn-styled theme-primary w-25" data-bs-toggle="dialog" data-bs-target="#addproducto"><i class="bi bi-bag-plus-fill"></i>Agregar</button>
        </div>
        
        <table class="table table-striped table-hover mt-3">
            <tr class="text-center">
                <td>PRODUCTO</td>
                <td>PRECIO</td>
                <td>STOCK</td>
                <td>CANTIDAD</td>
                
            </tr>
            <tbody id="obtenerproductos">

            </tbody>
        </table>
    </div>


        <dialog class="dialog" id="addproducto">
    <div class="dialog-header">
        <h1 class="dialog-title">Agregar producto</h1>
        <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
    </div>
    <div class="dialog-body">
        <h3>NOMBRE</h3>
        <input type="text" id="nombre" class="form-control"><br>
        <h3>PRECIO</h3>
        <input type="text" id="precio" class="form-control"><br> 
        <h3>STOCK</h3>
        <input type="number" id="stock" class="form-control" value="1" min="0"><br>
    </div>
    <div class="dialog-footer">
        <button type="button" class="btn-solid theme-danger" data-bs-dismiss="dialog"><i class="bi bi-x-lg"></i>Cancelar</button>
        <button type="button" class="btn-solid theme-success" id="btnSave"><i class="bi bi-floppy2"></i>Guardar</button>
    </div>
    </dialog>

    <dialog class="dialog" id="editproducto">
    <div class="dialog-header">
        <h1 class="dialog-title">Editar producto</h1>
        <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
    </div>
    <div class="dialog-body">
        <h3>NOMBRE</h3>
        <input type="text" id="nombree" class="form-control"><br>
        <h3>PRECIO</h3>
        <input type="text" id="precioe" class="form-control"><br> 
        <h3>STOCK</h3>
        <input type="number" id="stocke" class="form-control" value="1" min="0"><br>
    </div>
    <div class="dialog-footer">
        <input type="hidden" id="posicion">
        <button type="button" class="btn-solid theme-danger" data-bs-dismiss="dialog"><i class="bi bi-x-lg"></i>Cancelar</button>
        <button type="button" class="btn-solid theme-success" id="btnEdit"><i class="bi bi-floppy2"></i>Guardar</button>
    </div>
    </dialog>


    <script type="module" src="js/bootstrap.bundle.min.js"></script>
    <script src="js/sweetalert2.all.min.js"></script>
    <script src="js/tiendita.js"></script>
</body>
</html>
